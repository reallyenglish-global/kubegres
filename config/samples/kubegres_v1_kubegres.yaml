apiVersion: kubegres.reactive-tech.io/v1
kind: Kubegres
metadata:
  labels:
    app.kubernetes.io/name: kubegres
    app.kubernetes.io/managed-by: kustomize
  name: kubegres-sample
spec:
  failover:
    # Set true to promote a Ready replica when Kubernetes marks the primary
    # for voluntary disruption (for example, a node drain eviction).
    onPrimaryPodDrain: true
