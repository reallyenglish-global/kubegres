name: Kubegres CI

on:
  workflow_dispatch:
  push:
    branches: [main, pre-stop]
  pull_request:

jobs:
  fast:
    name: Fast checks and shard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-fast
      - name: Verify generated files are committed
        run: make verify-generated

  test:
    needs: fast
    name: Run Kubegres Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - shard-1
          - shard-2
          - shard-3
          - shard-4
          - shard-5
          - shard-6
          - shard-7
          - shard-8
          - shard-9
          - shard-10
          - shard-11
          - shard-12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.36.1
          cluster_name: kubegres
          config: internal/test/util/kindcluster/kind-cluster-config.yaml

      - name: Export KUBECONFIG
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Run Tests
        env:
          GINKGO_LABEL_FILTER: ${{ matrix.group }}
          KUBEGRES_KEEP_TEST_CLUSTER: "true"
        run: make test
        timeout-minutes: 60

      - name: Summarise spec durations
        if: always()
        run: |
          if test -f artifacts/reports/report.json; then
            python3 hack/report_tests.py artifacts/reports/report.json > artifacts/reports/summary.md
            cat artifacts/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect Kubernetes diagnostics
        if: always()
        run: |
          mkdir -p artifacts/kubernetes
          kubectl get pods -A -o wide > artifacts/kubernetes/pods.txt || true
          kubectl get statefulsets -A > artifacts/kubernetes/statefulsets.txt || true
          kubectl get pvc -A > artifacts/kubernetes/pvcs.txt || true
          kubectl get kubegres -A > artifacts/kubernetes/kubegres.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/kubernetes/events.txt || true
          kubectl describe pods -A > artifacts/kubernetes/pod-descriptions.txt || true
          kubectl describe statefulsets -A > artifacts/kubernetes/statefulset-descriptions.txt || true

      - name: Upload test reports and Kubernetes diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubegres-kubernetes-diagnostics-${{ matrix.group }}
          path: artifacts
          if-no-files-found: ignore

      - name: Delete Kind cluster (cleanup)
        if: always()
        run: kind delete cluster --name kubegres

  helm:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.11.1
      - name: Lint chart
        run: helm lint charts/kubegres
      - name: Render chart including CRDs
        run: helm template kubegres charts/kubegres --namespace kubegres-system --include-crds
