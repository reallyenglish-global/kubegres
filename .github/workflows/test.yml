name: Kubegres CI

on:
  push:
    branches: [main, pre-stop]
  pull_request:

jobs:
  test:
    name: Run Kubegres Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - core-failover
          - database-specs
          - storage-config
          - scheduling-metadata

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: v0.22.0

      - name: Export KUBECONFIG
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Run Tests
        env:
          GINKGO_LABEL_FILTER: ${{ matrix.group }}
        run: make test
        timeout-minutes: 60

      - name: Collect Kubernetes diagnostics
        if: always()
        run: |
          mkdir -p artifacts/kubernetes
          kubectl get pods -A -o wide > artifacts/kubernetes/pods.txt || true
          kubectl get statefulsets -A > artifacts/kubernetes/statefulsets.txt || true
          kubectl get pvc -A > artifacts/kubernetes/pvcs.txt || true
          kubectl get kubegres -A > artifacts/kubernetes/kubegres.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/kubernetes/events.txt || true
          kubectl describe pods -A > artifacts/kubernetes/pod-descriptions.txt || true
          kubectl describe statefulsets -A > artifacts/kubernetes/statefulset-descriptions.txt || true

      - name: Upload test reports and Kubernetes diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubegres-kubernetes-diagnostics-${{ matrix.group }}
          path: artifacts
          if-no-files-found: ignore

      - name: Delete Kind cluster (cleanup)
        if: always()
        run: kind delete cluster
