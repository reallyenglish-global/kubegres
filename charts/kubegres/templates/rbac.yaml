apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubegres.fullname" . }}
  labels:
    {{- include "kubegres.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps, events, persistentvolumeclaims, pods, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [apps]
  resources: [statefulsets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [kubegres.reactive-tech.io]
  resources: [kubegres]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [kubegres.reactive-tech.io]
  resources: [kubegres/finalizers]
  verbs: [update]
- apiGroups: [kubegres.reactive-tech.io]
  resources: [kubegres/status]
  verbs: [get, patch, update]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubegres.fullname" . }}
  labels:
    {{- include "kubegres.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubegres.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubegres.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubegres.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubegres.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps, events]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubegres.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubegres.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubegres.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "kubegres.fullname" . }}
  namespace: {{ .Release.Namespace }}
