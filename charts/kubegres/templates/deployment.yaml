apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubegres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubegres.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubegres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubegres.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ include "kubegres.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/manager"]
        args:
        {{- if .Values.leaderElection.enabled }}
          - --leader-elect
        {{- end }}
          - --health-probe-bind-address=:8081
        {{- if .Values.metrics.enabled }}
          - --metrics-bind-address=:8443
          - --metrics-secure={{ .Values.metrics.secure }}
        {{- else }}
          - --metrics-bind-address=0
        {{- end }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 10
